<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
        }

        .container {
            text-align: center;
        }

        p {
            font-size: 24px;
            margin-bottom: 20px;
        }

        button {
            padding: 10px 20px;
            border: none;
            background: #4CAF50;
            color: white;
            cursor: pointer;
            border-radius: 6px;
        }

        button:hover {
            background: #45a049;
        }
    </style>
</head>
<body>

    <div class="container">
        <p>Due to current misuse of the browsers, they have been indefinitely been disabled for public use. Please refer to the info page to read the rules of the site. </p>
        <button onclick="goBack()">Go to Index</button>
    </div>

    <script>
        function goBack() {
            window.location.href = "index.html";
        }
    </script>

</body>
</html>
