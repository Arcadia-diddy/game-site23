<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Settings – Unblocked Hub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="assets/logo.png" id="favicon">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@600;800&display=swap');

    :root {
      --bg:#0d0d0d;
      --card:#1a1a1a;
      --text:#eee;
      --glow:#00ff88;
      --accent:#00bfff;
    }

    * { margin:0; padding:0; box-sizing:border-box }

    body {
      font-family:'Inter',sans-serif;
      background:var(--bg);
      color:var(--text);
      padding:2rem;
      line-height:1.7;
      transition:all .3s;
    }

    body.custom-bg {
      background-size:cover;
      background-position:center;
      background-attachment:fixed;
    }

    h1 {
      font-size:2.5rem;
      text-align:center;
      margin:1rem 0;
      background:linear-gradient(90deg,var(--glow),var(--accent));
      -webkit-background-clip:text;
      color:transparent;
    }

    nav a {
      font-size:1.3rem;
      margin:0 .5rem;
      color:#aaa;
      text-decoration:none;
    }
    nav a:hover { color:var(--glow) }

    .box {
      background:var(--card);
      padding:2rem;
      border-radius:12px;
      margin:2rem auto;
      max-width:700px;
    }

    .field { margin:1.5rem 0 }

    label {
      display:block;
      font-weight:600;
      margin-bottom:.5rem;
      color:var(--glow);
    }

    input[type="text"],
    input[type="file"],
    select {
      width:100%;
      padding:.8rem;
      border-radius:8px;
      border:1px solid #444;
      background:#222;
      color:#fff;
      font-size:1rem;
    }

    .toggle {
      display:flex;
      align-items:center;
      justify-content:space-between;
      background:#222;
      padding:.7rem 1rem;
      border-radius:10px;
    }

    .theme-grid {
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(120px,1fr));
      gap:1rem;
      margin-top:1rem;
    }

    .theme-btn {
      background:var(--card);
      padding:.8rem;
      border-radius:10px;
      text-align:center;
      cursor:pointer;
      transition:.3s;
      border:2px solid transparent;
      font-size:.9rem;
    }

    .theme-btn.active {
      border-color:var(--glow);
      box-shadow:0 0 15px rgba(0,255,136,.5);
    }

    .theme-btn div:first-child {
      height:50px;
      border-radius:6px;
      margin-bottom:.4rem;
    }

    .btn-save {
      display:block;
      width:100%;
      background:var(--glow);
      color:#000;
      padding:1rem;
      font-weight:800;
      border-radius:12px;
      margin-top:2rem;
      text-align:center;
      cursor:pointer;
    }

    .small-btn {
      background:#333;
      color:#fff;
      padding:.8rem;
      border-radius:10px;
      text-align:center;
      cursor:pointer;
      margin-top:1rem;
    }

    .footer {
      text-align:center;
      margin-top:3rem;
      font-size:.8rem;
      color:#666;
    }
  </style>
</head>

<body>
<nav style="text-align:center">
  <a href="index.html">Home</a>
  <a href="games.html">Games</a>
  <a href="apps.html">Apps</a>
  <a href="info.html">Info</a>
  <a href="settings.html">Settings</a>
</nav>

<h1>Settings</h1>

<div class="box">

  <div class="field">
    <label>Site Name</label>
    <input type="text" id="siteName" placeholder="milesshawt epic site">
  </div>

  <div class="field">
    <label>Change Favicon</label>
    <input type="file" id="faviconInput" accept=".png,.ico">
  </div>

  <div class="field toggle">
    <label>Auto-Save Settings</label>
    <input type="checkbox" id="autoSave">
  </div>

  <div class="field">
    <label>Tab Cloak</label>
    <select id="tabCloak">
      <option value="none">None</option>
      <option value="google">Google</option>
      <option value="drive">Google Drive</option>
      <option value="classroom">Google Classroom</option>
      <option value="docs">Google Docs</option>
    </select>
  </div>

  <div class="field">
    <label>Startup Page</label>
    <select id="startupPage">
      <option value="index.html">Home</option>
      <option value="games.html">Games</option>
      <option value="apps.html">Apps</option>
    </select>
  </div>

  <div class="field">
    <label>Custom Background Image</label>
    <input type="file" id="bgInput" accept="image/*">
  </div>

  <div class="field">
    <label>Panic Key (ESC)</label>
    <input type="text" id="panicUrl" placeholder="https://classroom.google.com">
  </div>

  <div class="field">
    <label>Choose Theme</label>
    <div class="theme-grid" id="themeGrid"></div>
  </div>

  <div class="small-btn" onclick="resetSettings()">Reset All Settings</div>
  <div class="btn-save" onclick="saveSettings()">Save Settings</div>

</div>

<div class="footer">hi</div>

<script>
const themes = {
  dark:{bg:"#0d0d0d",card:"#1a1a1a",text:"#eee",glow:"#00ff88",accent:"#00bfff"},
  light:{bg:"#f5f5f5",card:"#fff",text:"#111",glow:"#00c853",accent:"#2962ff"},
  ocean:{bg:"#0a1a2f",card:"#0f2b4a",text:"#a0e7ff",glow:"#00d4ff",accent:"#0099cc"},
  neon:{bg:"#1a0033",card:"#2a004d",text:"#e0b3ff",glow:"#ff00ff",accent:"#9d00ff"}
};

const cloaks = {
  google:{title:"Google",icon:"https://www.google.com/favicon.ico"},
  drive:{title:"My Drive - Google Drive",icon:"https://ssl.gstatic.com/images/branding/product/1x/drive_2020q4_32dp.png"},
  classroom:{title:"Classes",icon:"https://ssl.gstatic.com/classroom/favicon.png"},
  docs:{title:"Google Docs",icon:"https://ssl.gstatic.com/docs/documents/images/kix-favicon7.ico"}
};

const grid=document.getElementById("themeGrid");
Object.keys(themes).forEach(k=>{
  const b=document.createElement("div");
  b.className="theme-btn";
  b.dataset.theme=k;
  b.innerHTML=`<div style="background:linear-gradient(135deg,${themes[k].bg},${themes[k].card})"></div>${k}`;
  b.onclick=()=>selectTheme(k,b);
  grid.appendChild(b);
});

function selectTheme(k,b){
  document.querySelectorAll(".theme-btn").forEach(x=>x.classList.remove("active"));
  b.classList.add("active");
  applyTheme(k);
  autoSaveIfOn();
}

function applyTheme(k){
  const t=themes[k];
  Object.keys(t).forEach(v=>document.documentElement.style.setProperty("--"+v,t[v]));
}

function autoSaveIfOn(){ if(autoSave.checked) saveSettings(); }

bgInput.onchange=e=>{
  const f=e.target.files[0];
  if(!f) return;
  const r=new FileReader();
  r.onload=ev=>{
    document.body.style.backgroundImage=`url(${ev.target.result})`;
    document.body.classList.add("custom-bg");
    localStorage.setItem("customBg",ev.target.result);
    autoSaveIfOn();
  };
  r.readAsDataURL(f);
};

document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){
    window.location.replace(panicUrl.value||"https://google.com");
  }
});

function saveSettings(){
  const settings={
    name:siteName.value,
    favicon:favicon.href,
    theme:document.querySelector(".theme-btn.active")?.dataset.theme,
    cloak:tabCloak.value,
    startup:startupPage.value,
    auto:autoSave.checked,
    panic:panicUrl.value
  };
  localStorage.setItem("unblockedHubSettings",JSON.stringify(settings));
  if(cloaks[settings.cloak]){
    document.title=cloaks[settings.cloak].title;
    favicon.href=cloaks[settings.cloak].icon;
  } else document.title=settings.name;
}

function resetSettings(){
  localStorage.clear();
  location.reload();
}

const saved=JSON.parse(localStorage.getItem("unblockedHubSettings")||"{}");
if(saved.name) siteName.value=saved.name;
if(saved.auto) autoSave.checked=true;
if(saved.startup) startupPage.value=saved.startup;
if(saved.panic) panicUrl.value=saved.panic;
if(saved.theme && themes[saved.theme]){
  applyTheme(saved.theme);
  document.querySelector(`[data-theme="${saved.theme}"]`).classList.add("active");
}
if(saved.cloak) tabCloak.value=saved.cloak;

const bg=localStorage.getItem("customBg");
if(bg){
  document.body.style.backgroundImage=`url(${bg})`;
  document.body.classList.add("custom-bg");
}
</script>
</body>
</html>
