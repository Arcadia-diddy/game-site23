<html>
<body>
<button onclick="openGame()">Open Cloaked Site</button>
<script>
function openGame() {
  var win = window.open();
  var url = "https://maceo-vs-howard.vercel.app/index.html"; // **Replace with your desired URL**
  var iframe = win.document.createElement('iframe');
  iframe.style.width = "100%";
  iframe.style.height = "100%";
  iframe.style.border = "none";
  iframe.src = url;
  win.document.body.appendChild(iframe);
}
</script>
</body>
</html>
