<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Easter Egg Page</title>
  <style>
        /* ===== CUSTOMIZATION SECTION ===== */
        :root {
            --bg-color: #1a1a2e;           /* Dark navy background for a modern feel */
            --text-color: #f5f5f5;         /* Light text for contrast */
            --accent-color: #ff6f61;       /* Coral accent for headings and hover effects */
            --font-family: 'Arial', sans-serif;
            --font-style: normal;           /* Italic can be a bit hard to read, normal looks cleaner */
            --image-url: 'https://placekitten.com/400/300';
            --music-url: '';                
        }

        /* ===== PAGE STYLING ===== */
        body {
            margin: 0;
            padding: 0;
            font-family: var(--font-family);
            font-style: var(--font-style);
            background: linear-gradient(135deg, #1a1a2e, #162447); /* subtle gradient for depth */
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            overflow: hidden;
        }

        h1 {
            font-size: 3em;
            margin-bottom: 0.5em;
            color: var(--accent-color);
            text-shadow: 2px 2px 6px rgba(0,0,0,0.5); /* subtle glow for emphasis */
        }

        p {
            font-size: 1.2em;
            margin-bottom: 1em;
            color: #dcdde1; /* slightly softer than pure white for readability */
        }

        img {
            max-width: 80%;
            border-radius: 20px;
            margin-top: 20px;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
        }

        img:hover {
            transform: rotate(10deg) scale(1.05);
            box-shadow: 0 12px 25px rgba(255,111,97,0.6); /* accent color glow on hover */
        }

        audio {
            display: none; /* keeps audio element hidden */
        }
  </style>

</head>
<body>
  <h1>wyd son how u find ts</h1>
  
  <img src="assets/thisimage.png" alt="this is an image" id="eggImage" style="width: 100px; height: auto;">


  <!-- Background Music -->
  <audio id="bgMusic" src="apps/music/music/songs/Blonde_KLICKAUD.mp3" autoplay loop></audio>

  <script>
    const img = document.getElementById('eggImage');
    const music = document.getElementById('bgMusic');

    // Load music from CSS variable
    const musicUrl = getComputedStyle(document.documentElement).getPropertyValue('--music-url').trim();
    if(musicUrl){
      music.src = musicUrl;
      music.play().catch(() => {
        console.log('Autoplay prevented by browser, click image to start music.');
      });
    }

    // Image click action
    img.addEventListener('click', () => {
      if(music.paused) music.play();
    });
  </script>
</body>
</html>
