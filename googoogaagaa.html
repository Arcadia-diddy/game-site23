<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Easter Egg Page</title>
  <style>
    /* ===== CUSTOMIZATION SECTION ===== */
    :root {
      --bg-color: #fffae3;           
      --text-color: #333;            
      --font-family: 'Arial', sans-serif; 
      --font-style: italic;          
      --image-url: 'https://placekitten.com/400/300'; 
      --music-url: '';               /* Add your mp3 URL here */
    }

    /* ===== PAGE STYLING ===== */
    body {
      margin: 0;
      padding: 0;
      font-family: var(--font-family);
      font-style: var(--font-style);
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      overflow: hidden;
    }

    h1 {
      font-size: 3em;
      margin-bottom: 0.2em;
    }

    p {
      font-size: 1.2em;
      margin-bottom: 1em;
    }

    img {
      max-width: 80%;
      border-radius: 20px;
      margin-top: 20px;
      cursor: pointer;
      transition: transform 0.3s;
    }

    img:hover {
      transform: rotate(10deg) scale(1.05);
    }
  </style>
</head>
<body>
  <h1>wyd son how u find ts</h1>
  
  <img src="assets/thisimage.png" alt="this is an image" id="eggImage">

  <!-- Background Music -->
  <audio id="bgMusic" src="apps/music/music/songs/Blonde_KLICKAUD.mp3" autoplay loop></audio>

  <script>
    const img = document.getElementById('eggImage');
    const music = document.getElementById('bgMusic');

    // Load music from CSS variable
    const musicUrl = getComputedStyle(document.documentElement).getPropertyValue('--music-url').trim();
    if(musicUrl){
      music.src = musicUrl;
      music.play().catch(() => {
        console.log('Autoplay prevented by browser, click image to start music.');
      });
    }

    // Image click action
    img.addEventListener('click', () => {
      alert('🎉 Surprise! You found the hidden message!');
      if(music.paused) music.play();
    });
  </script>
</body>
</html>
