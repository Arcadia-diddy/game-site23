<!DOCTYPE html>

<!-- Ultimate Game Stash file -->
<!-- Ads & monetization fully removed -->

<html lang="en">
<head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <base href="https://cdn.jsdelivr.net/gh/bubbls/UGS-Assets@23edae6437a2cded4027d5c487fc9f6362e3ebfd/bacon%20may%20die/">
    <meta http-equiv="pragma" content="no-cache" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta charset="utf-8" />
    <meta name="robots" content="noindex,nofollow" />

    <title>Bacon May Die by SnoutUp</title>

    <style>
        html, body {
            height: 100%;
            width: 100%;
            margin: 0;
            overflow: hidden;
            background-color: #191923;
            background-image: url('html5game/bg.jpg');
            background-repeat: repeat-x;
            background-position: center center;
            background-size: 0 0;
        }

        canvas {
            display: none;
            image-rendering: optimizeSpeed;
            -webkit-interpolation-mode: nearest-neighbor;
        }

        #bar {
            position: fixed;
            height: 56%;
            width: 5px;
            margin: 0 auto;
            left: 0;
            right: 0;
            background: rgba(25,25,35,0.5);
        }

        #fill {
            height: 1%;
            width: 5px;
            background: #a4a6b5;
        }

        img#spider {
            position: absolute;
            left: -67px;
            bottom: -30px;
        }

        .torch {
            position: fixed;
            height: 128px;
            width: 128px;
            top: 30%;
        }

        #t1 { left: 20%; }
        #t2 { right: 20%; }
    </style>
</head>

<body id="body">

<div class="gm4html5_div_class" id="gm4html5_div_id">
    <canvas id="canvas" width="1024" height="576"></canvas>
    <script src="html5game/BaconMayDie.js"></script>
</div>

<div id="bar">
    <div id="fill">
        <img id="spider" src="html5game/spider.png" alt="">
    </div>
</div>

<div id="decor">
    <img class="torch" id="t1" src="html5game/torch.gif" alt="">
    <img class="torch" id="t2" src="html5game/torch.gif" alt="">
</div>

<script>
    var canvas = document.getElementById("canvas");
    var bar = document.getElementById("bar");
    var fill = document.getElementById("fill");
    var decor = document.getElementById("decor");

    var progress = 0;

    function startGame() {
        try {
            GameMaker_Init();
            bar.style.display = "none";
            decor.style.display = "none";
            canvas.style.display = "block";
        } catch (e) {
            setTimeout(startGame, 1000);
        }
    }

    var loadingInterval = setInterval(() => {
        progress = Math.min(progress + 1, 100);
        fill.style.height = progress + "%";
        if (progress >= 100) {
            clearInterval(loadingInterval);
            setTimeout(startGame, 500);
        }
    }, 20);

    window.onload = () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        window.focus();
    };

    window.addEventListener('wheel', e => e.preventDefault(), { passive: false });
    window.addEventListener('keydown', e => {
        if (['ArrowDown','ArrowUp',' '].includes(e.key)) e.preventDefault();
    });
</script>

</body>
</html>
