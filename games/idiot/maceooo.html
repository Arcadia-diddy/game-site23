<!DOCTYPE html>
<html>
<head>
    <title>what is this maceo</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background: #111;
            font-family: Arial, sans-serif;
        }

        .row {
            display: flex;
            width: 100%;
            height: 100%;
        }

        img {
            width: 50%;
            height: 100%;
            object-fit: fill; /* stretches to fit exactly */
        }

        .center-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 100px;
            text-shadow: 0 0 10px black;
            pointer-events: none; /* text doesn't block clicking */
        }
    </style>
</head>
<body>

    <div class="row">
        <img src="shur.png" alt="maceoooo">
        <img src="shur2.png" alt="maceoooo2">
    </div>

    <div class="center-text">what is this maceo</div>

</body>
</html>
