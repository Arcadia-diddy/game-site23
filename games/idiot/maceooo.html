<!DOCTYPE html>
<html>
<head>
    <title>what is this maceo</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden; /* no scrolling */
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
        }

        .row {
            display: flex;
            width: 100%;
            height: 85%; /* images take most of the screen */
        }

        img {
            width: 50%;
            height: 100%;
            object-fit: cover; /* stretches to fill without distortion */
        }

        p {
            text-align: center;
            font-size: 22px;
            margin: 10px 0 0 0;
        }
    </style>
</head>
<body>

    <div class="row">
        <img src="shur.png" alt="maceoooo">
        <img src="shur2.png" alt="maceoooo2">
    </div>

    <p>what is this maceo /p>

</body>
</html>
