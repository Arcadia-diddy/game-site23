<!DOCTYPE html>
<html>
<head>
    <title>what is this maceo</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden; /* no scrolling */
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
        }

        .row {
            display: flex;
            width: 100%;
            height: calc(100% - 40px); /* leave room for text */
        }

        img {
            width: 50%;
            height: 100%;
            object-fit: fill; /* <-- forces stretching */
        }

        p {
            height: 40px;
            margin: 0;
            text-align: center;
            line-height: 40px;
            font-size: 60px;
        }
    </style>
</head>
<body>

    <div class="row">
        <img src="shur.png" alt="maceoooo">
        <img src="shur2.png" alt="maceoooo2">
    </div>

    <p>what is this maceo</p>

</body>
</html>
